{% extends "base.html" %}
{% block title %}Sign up — CampusKit{% endblock %}
{% block content %}
<div class="container section">
  <div class="form-panel">
    <h2>Create an account</h2>
    <form method="post">
      <div class="field">
        <label>Full name</label>
        <input type="text" name="name" value="{{ name or '' }}" required autofocus>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <label>College (optional)</label>
        <input type="text" name="college" value="{{ college or '' }}">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" name="confirm_password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-amber btn-block">Sign up</button>
    </form>
    <p class="muted" style="margin-top:16px;">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
