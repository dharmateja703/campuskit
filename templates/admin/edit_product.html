{% extends "admin/_layout.html" %}
{% block title %}Edit {{ product.name }} — CampusKit{% endblock %}
{% block admin_content %}
<h2>Edit product</h2>
<div class="form-panel wide" style="margin:0 0 20px;">
  <form method="post" enctype="multipart/form-data">
    <div class="field">
      <label>Product name</label>
      <input type="text" name="name" value="{{ product.name }}" required>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Category</label>
        <select name="category" required>
          {% for cat in categories %}
            <option value="{{ cat }}" {% if product.category == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Brand</label>
        <input type="text" name="brand" value="{{ product.brand or '' }}">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Price (₹)</label>
        <input type="number" step="0.01" min="0" name="price" value="{{ product.price }}" required>
      </div>
      <div class="field">
        <label>Stock quantity</label>
        <input type="number" min="0" name="stock" value="{{ product.stock }}">
      </div>
    </div>
    <div class="field">
      <label>Description</label>
      <textarea name="description">{{ product.description }}</textarea>
    </div>
    <div class="field checkbox-field">
      <input type="checkbox" name="is_active" id="is_active" {% if product.is_active %}checked{% endif %}>
      <label for="is_active" style="margin:0;">Visible in storefront</label>
    </div>
    <div class="field">
      <label>Add more images</label>
      <input type="file" name="images" accept="image/*" multiple>
    </div>
    <button type="submit" class="btn btn-amber">Save changes</button>
  </form>
</div>

<form method="post" action="{{ url_for('admin.delete_product', product_id=product.id) }}" onsubmit="return confirm('Permanently delete this product and its images? This cannot be undone.');" style="margin-bottom:20px;">
  <button type="submit" class="btn btn-danger btn-sm">Delete this product permanently</button>
</form>

{% if product.images %}
<h3>Current images</h3>
<div class="thumb-row" style="margin-bottom:20px;">
  {% for img in product.images %}
  <div style="text-align:center;">
    <img src="{{ url_for('static', filename='uploads/products/' ~ img.filename) }}" style="width:80px; height:80px; object-fit:cover;">
    <form method="post" action="{{ url_for('admin.delete_image', image_id=img.id) }}" onsubmit="return confirm('Remove this image?');">
      <button type="submit" class="btn btn-danger btn-sm" style="margin-top:4px; padding:2px 8px; font-size:0.7rem;">Delete</button>
    </form>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endblock %}
