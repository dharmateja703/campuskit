{% extends "base.html" %}
{% block title %}Log in — CampusKit{% endblock %}
{% block content %}
<div class="container section">
  <div class="form-panel">
    <h2>Log in</h2>
    <form method="post">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-amber btn-block">Log in</button>
    </form>
    <p class="muted" style="margin-top:16px;">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
